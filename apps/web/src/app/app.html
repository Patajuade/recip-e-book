<div class="min-h-screen">
  <header *transloco="let t" class="border-b border-line bg-surface">
    <div
      class="mx-auto flex max-w-5xl flex-wrap items-center gap-x-6 gap-y-2 px-4 py-3"
    >
      <a routerLink="/" class="flex items-center gap-2 font-display text-xl">
        <!-- Same drawing as public/favicon.svg, colored by the theme. -->
        <svg aria-hidden="true" viewBox="0 0 32 32" class="size-7">
          <rect width="32" height="32" rx="7" class="fill-primary" />
          <path
            d="M12 10c-1.4-1.6 1.4-2.6 0-4.5M16 10c-1.4-1.6 1.4-2.6 0-4.5M20 10c-1.4-1.6 1.4-2.6 0-4.5"
            fill="none"
            stroke-width="1.8"
            stroke-linecap="round"
            class="stroke-accent"
          />
          <g class="fill-on-primary">
            <rect x="6" y="12.5" width="20" height="3" rx="1.5" />
            <path d="M7.5 16.5h17v5.5a4 4 0 0 1-4 4h-9a4 4 0 0 1-4-4z" />
            <rect x="3.8" y="17.6" width="4.2" height="2.6" rx="1.3" />
            <rect x="24" y="17.6" width="4.2" height="2.6" rx="1.3" />
          </g>
        </svg>
        Recip-e-book
      </a>

      <nav [attr.aria-label]="t('layout.mainNav.label')" class="flex-1">
        <ul class="flex gap-1">
          <li>
            <a
              routerLink="/recipes"
              routerLinkActive="bg-surface-raised font-semibold"
              ariaCurrentWhenActive="page"
              class="rounded px-3 py-2 text-sm whitespace-nowrap text-fg-muted hover:bg-surface-raised hover:text-fg aria-[current=page]:text-fg"
              >{{ t('layout.nav.recipes') }}</a
            >
          </li>
          <li>
            <a
              routerLink="/shopping"
              routerLinkActive="bg-surface-raised font-semibold"
              ariaCurrentWhenActive="page"
              class="rounded px-3 py-2 text-sm whitespace-nowrap text-fg-muted hover:bg-surface-raised hover:text-fg aria-[current=page]:text-fg"
              >{{ t('layout.nav.shopping') }}</a
            >
          </li>
        </ul>
      </nav>

      <div class="flex items-center gap-2">
        <lib-theme-picker />
        <lib-language-switcher />
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-4 py-6">
    <router-outlet />
  </main>

  <lib-toast-list />
</div>
