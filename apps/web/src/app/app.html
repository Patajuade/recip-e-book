<div class="min-h-screen bg-stone-50 text-stone-900">
  <header *transloco="let t" class="border-b border-stone-200 bg-white">
    <div
      class="mx-auto flex max-w-5xl flex-wrap items-center gap-x-6 gap-y-2 px-4 py-3"
    >
      <a routerLink="/" class="text-lg font-bold">Recip-e-book</a>

      <nav [attr.aria-label]="t('layout.mainNav.label')" class="flex-1">
        <ul class="flex gap-1">
          <li>
            <a
              routerLink="/recipes"
              routerLinkActive="bg-stone-100 font-semibold"
              [routerLinkActiveOptions]="{ exact: true }"
              ariaCurrentWhenActive="page"
              class="rounded px-3 py-2 text-sm hover:bg-stone-100"
              >{{ t('layout.nav.recipes') }}</a
            >
          </li>
          <li>
            <a
              routerLink="/recipes/new"
              routerLinkActive="bg-stone-100 font-semibold"
              ariaCurrentWhenActive="page"
              class="rounded px-3 py-2 text-sm hover:bg-stone-100"
              >{{ t('layout.nav.newRecipe') }}</a
            >
          </li>
        </ul>
      </nav>

      <lib-language-switcher />
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-4 py-6">
    <router-outlet />
  </main>

  <lib-toast-list />
</div>
