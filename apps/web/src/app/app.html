<div class="min-h-screen">
  <header *transloco="let t" class="border-b border-line bg-surface">
    <div
      class="mx-auto flex max-w-5xl flex-wrap items-center gap-x-6 gap-y-2 px-4 py-3"
    >
      <a routerLink="/" class="flex items-center gap-2 font-display text-xl">
        <app-logo class="size-7" />
        Recip-e-book
      </a>

      <nav [attr.aria-label]="t('layout.mainNav.label')" class="flex-1">
        <ul class="flex gap-1">
          <li>
            <a
              routerLink="/recipes"
              routerLinkActive="bg-surface-raised font-semibold"
              ariaCurrentWhenActive="page"
              class="rounded px-3 py-2 text-sm whitespace-nowrap text-fg-muted hover:bg-surface-raised hover:text-fg aria-[current=page]:text-fg"
              >{{ t('layout.nav.recipes') }}</a
            >
          </li>
          <li>
            <a
              routerLink="/shopping"
              routerLinkActive="bg-surface-raised font-semibold"
              ariaCurrentWhenActive="page"
              class="rounded px-3 py-2 text-sm whitespace-nowrap text-fg-muted hover:bg-surface-raised hover:text-fg aria-[current=page]:text-fg"
              >{{ t('layout.nav.shopping') }}</a
            >
          </li>
        </ul>
      </nav>

      <div class="flex items-center gap-2">
        <lib-theme-picker />
        <lib-language-switcher />
      </div>
    </div>
  </header>

  <!-- Live regions stay in the DOM: content added to them is what gets announced. -->
  <div *transloco="let t" class="border-line bg-surface-raised text-sm">
    <div role="status">
      @if (updates.ready()) {
        <p
          class="mx-auto flex max-w-5xl flex-wrap items-center gap-x-4 gap-y-2 border-b border-line px-4 py-2"
        >
          {{ t('pwa.updateReady') }}
          <button
            type="button"
            class="btn-accent py-1"
            (click)="updates.reload()"
          >
            {{ t('pwa.reload') }}
          </button>
        </p>
      }
      @if (!network.online()) {
        <p class="mx-auto max-w-5xl border-b border-line px-4 py-2">
          {{ t('pwa.offline') }}
        </p>
      }
    </div>
    <div role="alert">
      @if (updates.broken()) {
        <p
          class="mx-auto flex max-w-5xl flex-wrap items-center gap-x-4 gap-y-2 border-b border-line px-4 py-2"
        >
          {{ t('pwa.broken') }}
          <button
            type="button"
            class="btn-accent py-1"
            (click)="updates.reload()"
          >
            {{ t('pwa.reload') }}
          </button>
        </p>
      }
    </div>
  </div>

  <main class="mx-auto max-w-5xl px-4 py-6">
    <router-outlet />
  </main>

  <lib-toast-list />
</div>
