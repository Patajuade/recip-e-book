<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Recip-e-book</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The browser picks the best supported icon; if several fit, the last one wins (MDN). -->
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- Surface color of the default theme, as in the manifest. -->
    <meta name="theme-color" content="#250902" />
    <script>
      // Applies the saved theme before the first paint, so there's no flash of the default one.
      // ThemeSettings (shared/ui) validates the values and keeps them in sync afterwards.
      try {
        const theme = localStorage.getItem('recip-e-book.theme');
        const accent = localStorage.getItem('recip-e-book.accent');
        if (theme) document.documentElement.dataset.theme = theme;
        if (accent) document.documentElement.dataset.accent = accent;
      } catch {}
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>Recip-e-book needs JavaScript.</noscript>
  </body>
</html>
