<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Recip-e-book</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Applies the saved theme before the first paint, so there's no flash of the default one.
      // ThemeSettings (shared/ui) validates the values and keeps them in sync afterwards.
      try {
        const theme = localStorage.getItem('recip-e-book.theme');
        const accent = localStorage.getItem('recip-e-book.accent');
        if (theme) document.documentElement.dataset.theme = theme;
        if (accent) document.documentElement.dataset.accent = accent;
      } catch {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
