<article
  class="rounded-lg border border-stone-200 bg-white p-4 shadow-sm hover:shadow"
>
  <h2 class="text-lg font-semibold">
    <a [routerLink]="['/recipes', recipe().id]" class="hover:underline">{{
      recipe().title
    }}</a>
  </h2>

  @if (recipe().totalTimeMinutes; as minutes) {
    <p class="mt-1 text-sm text-stone-600">
      {{ minutes | duration: lang() }}
    </p>
  }
  @if (recipe().tags.length) {
    <ul class="mt-3 flex flex-wrap gap-1">
      @for (tag of recipe().tags; track tag) {
        <li>
          <a
            [routerLink]="['/recipes']"
            [queryParams]="{ tag }"
            class="block rounded-full bg-stone-100 px-2 py-0.5 text-xs hover:bg-stone-200"
            >{{ tag }}</a
          >
        </li>
      }
    </ul>
  }
</article>
