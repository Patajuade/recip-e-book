<article
  class="h-full rounded-lg border border-line bg-surface p-4 hover:border-line-strong"
>
  <h2 class="text-lg">
    <a [routerLink]="['/recipes', recipe().id]" class="hover:underline">{{
      recipe().title
    }}</a>
  </h2>

  @if (recipe().totalTimeMinutes; as minutes) {
    <p class="mt-1 text-sm text-fg-muted">
      {{ minutes | duration: lang() }}
    </p>
  }
  @if (recipe().tags.length) {
    <ul class="mt-3 flex flex-wrap gap-1">
      @for (tag of recipe().tags; track tag) {
        <li>
          <a
            [routerLink]="['/recipes']"
            [queryParams]="{ tag }"
            class="block rounded-full bg-surface-raised px-2 py-0.5 text-xs hover:bg-line"
            >{{ 'tags.' + tag | transloco }}</a
          >
        </li>
      }
    </ul>
  }
</article>
