<ng-container *transloco="let t">
  <h2 id="confirm-dialog-title" class="text-xl">
    {{ data.title }}
  </h2>
  <p id="confirm-dialog-message" class="text-fg-muted">{{ data.message }}</p>
  <!-- Cancel comes first: it gets the initial focus (autoFocus: 'first-tabbable'). -->
  <div class="flex justify-end gap-2">
    <button
      type="button"
      class="rounded px-4 py-2 text-sm text-fg-muted hover:bg-surface-raised hover:text-fg"
      (click)="dialogRef.close(false)"
    >
      {{ t('common.cancel') }}
    </button>
    <button type="button" class="btn-danger" (click)="dialogRef.close(true)">
      {{ data.confirmLabel }}
    </button>
  </div>
</ng-container>
