@let state = field()();
<!-- Always rendered, so screen readers announce errors when they appear. -->
<div [attr.id]="id()" aria-live="polite">
  @if (state.touched() && state.invalid()) {
    <ul *transloco="let t" class="mt-1 text-sm text-danger">
      <!-- t(forms.errors.required, forms.errors.maxLength, forms.errors.min, forms.errors.max, forms.errors.server) -->
      @for (error of state.errors(); track error.kind) {
        <li>{{ t('forms.errors.' + error.kind, error) }}</li>
      }
    </ul>
  }
</div>
