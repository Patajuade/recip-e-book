<ng-container *transloco="let t">
  <!-- t(themes.cave, themes.sousbois, themes.nuit, themes.bistrot, themes.velours, themes.jardin, themes.terroir, themes.prune) -->
  <!-- t(accents.citron, accents.safran, accents.menthe, accents.glacier) -->
  <button
    type="button"
    class="flex items-center gap-2 rounded px-2 py-1 text-sm text-fg-muted hover:bg-surface-raised hover:text-fg"
    [cdkMenuTriggerFor]="menu"
  >
    <span aria-hidden="true" class="size-3 rounded-full bg-accent"></span>
    {{ t('themePicker.label') }}
  </button>

  <ng-template #menu>
    <div
      cdkMenu
      class="flex w-56 flex-col gap-1 rounded-lg border border-line bg-surface p-2 shadow-xl"
    >
      <p aria-hidden="true" class="px-2 pt-1 text-xs text-fg-muted">
        {{ t('themePicker.background') }}
      </p>
      <div cdkMenuGroup [attr.aria-label]="t('themePicker.background')">
        @for (theme of themes; track theme) {
          <button
            type="button"
            cdkMenuItemRadio
            class="flex w-full items-center gap-2 rounded px-2 py-1.5 text-left text-sm hover:bg-surface-raised"
            [cdkMenuItemChecked]="theme === settings.theme()"
            (cdkMenuItemTriggered)="settings.theme.set(theme)"
          >
            <!-- Background | header & cards, so two-tone themes can be told apart. -->
            <span
              aria-hidden="true"
              class="flex h-5 w-8 overflow-hidden rounded border border-line-strong"
              [attr.data-theme]="theme"
            >
              <span class="w-1/2 bg-canvas"></span>
              <span class="w-1/2 bg-surface"></span>
            </span>
            {{ t('themes.' + theme) }}
            @if (theme === settings.theme()) {
              <span aria-hidden="true" class="ml-auto">✓</span>
            }
          </button>
        }
      </div>

      <hr class="my-1 border-line" />

      <p aria-hidden="true" class="px-2 text-xs text-fg-muted">
        {{ t('themePicker.accent') }}
      </p>
      <div cdkMenuGroup [attr.aria-label]="t('themePicker.accent')">
        @for (accent of accents; track accent) {
          <button
            type="button"
            cdkMenuItemRadio
            class="flex w-full items-center gap-2 rounded px-2 py-1.5 text-left text-sm hover:bg-surface-raised"
            [cdkMenuItemChecked]="accent === settings.accent()"
            (cdkMenuItemTriggered)="settings.accent.set(accent)"
          >
            <span
              aria-hidden="true"
              class="size-5 rounded-full bg-accent"
              [attr.data-accent]="accent"
            ></span>
            {{ t('accents.' + accent) }}
            @if (accent === settings.accent()) {
              <span aria-hidden="true" class="ml-auto">✓</span>
            }
          </button>
        }
      </div>
    </div>
  </ng-template>
</ng-container>
