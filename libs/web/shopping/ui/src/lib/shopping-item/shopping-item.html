<div
  *transloco="let t"
  class="flex flex-wrap items-center gap-x-3 gap-y-1 rounded-lg border border-line bg-surface px-3 py-1"
>
  <!-- The whole label is the touch target: easy to hit with one hand in a store. -->
  <label
    class="flex min-h-11 min-w-40 flex-1 cursor-pointer items-center gap-3"
  >
    <input
      type="checkbox"
      class="size-6 shrink-0 accent-accent"
      [checked]="item().checked"
      (change)="toggled.emit()"
    />
    <span
      class="text-lg"
      [class.line-through]="item().checked"
      [class.text-fg-muted]="item().checked"
    >
      @let quantity = item().quantity;
      @if (quantity !== null) {
        <span class="font-medium"
          >{{ quantity | translocoDecimal }} {{ item().unit }}</span
        >
      }
      {{ item().name }}
    </span>
  </label>
  @if (item().sourceRecipe; as recipe) {
    <a
      [routerLink]="['/recipes', recipe.id]"
      class="text-xs text-primary-ink hover:underline"
      >{{ t('shopping.list.fromRecipe', { title: recipe.title }) }}</a
    >
  }
  <span class="flex">
    <button
      type="button"
      class="rounded px-3 py-2 text-fg-muted hover:bg-surface-raised hover:text-fg"
      [attr.aria-label]="t('shopping.list.edit', { name: item().name })"
      [title]="t('shopping.list.edit', { name: item().name })"
      (click)="editRequested.emit()"
    >
      <span aria-hidden="true">✎</span>
    </button>
    <button
      type="button"
      class="rounded px-3 py-2 text-fg-muted hover:bg-surface-raised hover:text-danger"
      [attr.aria-label]="t('shopping.list.remove', { name: item().name })"
      [title]="t('shopping.list.remove', { name: item().name })"
      (click)="removeRequested.emit()"
    >
      <span aria-hidden="true">✕</span>
    </button>
  </span>
</div>
